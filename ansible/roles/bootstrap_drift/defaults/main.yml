---
# These defaults describe the stable, non-secret portion of the EX44
# bootstrap. Host-specific values belong in inventory/group_vars and should be
# kept out of this role's source-controlled defaults.

bootstrap_users: []
bootstrap_user_shell: /bin/bash
bootstrap_user_groups:
  - sudo
bootstrap_user_directories:
  - .tmp
  - .cache
  - workspace
bootstrap_manage_authorized_keys: false
bootstrap_authorized_keys: {}
bootstrap_manage_user_dotfiles: true

bootstrap_packages:
  - apt-listchanges
  - auditd
  - build-essential
  - curl
  - dbus-user-session
  - dnsutils
  - fail2ban
  - file
  - git
  - htop
  - iptables
  - jq
  - less
  - lsof
  - man-db
  - mtr-tiny
  - net-tools
  - netcat-openbsd
  - needrestart
  - openssh-server
  - python3
  - python3-pip
  - python3-venv
  - restic
  - sudo
  - strace
  - sysstat
  - tcpdump
  - tmux
  - tree
  - ufw
  - uidmap
  - unattended-upgrades
  - unzip
  - vim
  - wget
  - whois
  - zip
bootstrap_optional_packages: []
bootstrap_package_state: present
bootstrap_apt_update_cache: true

bootstrap_ssh_service: ssh
bootstrap_ssh_allow_users: "{{ bootstrap_users }}"
bootstrap_ssh_config_path: /etc/ssh/sshd_config.d/hardening.conf

bootstrap_sysctl_settings:
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv6.conf.all.accept_source_route: 0
  net.ipv6.conf.default.accept_source_route: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_max_syn_backlog: 2048
  net.ipv4.tcp_synack_retries: 2
  net.ipv4.tcp_syn_retries: 5
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  kernel.randomize_va_space: 2
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  fs.suid_dumpable: 0
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1

bootstrap_ufw_rules:
  - comment: Allow Tailscale traffic
    interface: tailscale0
  - comment: Hetzner rescue FSN
    from_ip: 213.133.99.0/24
    port: "22"
    proto: tcp
  - comment: Hetzner rescue FSN
    from_ip: 213.133.100.0/24
    port: "22"
    proto: tcp
  - comment: Hetzner rescue NBG
    from_ip: 88.198.230.0/24
    port: "22"
    proto: tcp
  - comment: Hetzner rescue NBG
    from_ip: 88.198.231.0/24
    port: "22"
    proto: tcp
bootstrap_manage_firewall: true

bootstrap_manage_system_docker: false
bootstrap_manage_rootless_docker: false

bootstrap_backup_enabled: false
bootstrap_restic_env: {}
bootstrap_backup_log: /var/log/restic-backup.log
