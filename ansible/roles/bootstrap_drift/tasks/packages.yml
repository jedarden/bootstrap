---
- name: Require a Debian-family host
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: >-
      bootstrap_drift currently targets Debian/Ubuntu hosts, but this host is
      {{ ansible_os_family }}.

- name: Require one Docker daemon policy
  ansible.builtin.assert:
    that:
      - not (bootstrap_manage_system_docker | bool and bootstrap_manage_rootless_docker | bool)
    fail_msg: >-
      bootstrap_manage_system_docker and bootstrap_manage_rootless_docker are
      mutually exclusive; choose the daemon ownership policy explicitly.

- name: Refresh apt metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: bootstrap_apt_update_cache | bool

- name: Install bootstrap runtime packages
  ansible.builtin.apt:
    name: "{{ bootstrap_packages }}"
    state: "{{ bootstrap_package_state }}"

- name: Install explicitly requested optional packages
  ansible.builtin.apt:
    name: "{{ bootstrap_optional_packages }}"
    state: "{{ bootstrap_package_state }}"
  when: bootstrap_optional_packages | length > 0

- name: Install Docker and rootless runtime prerequisites when Docker is managed
  ansible.builtin.apt:
    name: "{{ bootstrap_rootless_docker_packages if bootstrap_manage_rootless_docker | bool else ['docker.io'] }}"
    state: "{{ bootstrap_package_state }}"
  when:
    - bootstrap_manage_system_docker | bool or bootstrap_manage_rootless_docker | bool

- name: Disable the system Docker daemon when rootless Docker is the policy
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - docker.service
    - docker.socket
  when: bootstrap_manage_rootless_docker | bool
