---
- name: Ensure configured supplementary groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ bootstrap_user_groups }}"

- name: Ensure each bootstrap user has a private primary group
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ bootstrap_users }}"

- name: Ensure configured bootstrap users exist
  ansible.builtin.user:
    name: "{{ item }}"
    shell: "{{ bootstrap_user_shell }}"
    create_home: true
    group: "{{ item }}"
    groups: "{{ bootstrap_user_groups | join(',') }}"
    append: true
  loop: "{{ bootstrap_users }}"

- name: Restrict bootstrap user home directories
  ansible.builtin.file:
    path: "/home/{{ item }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ bootstrap_users }}"

- name: Ensure bootstrap user directories exist
  ansible.builtin.file:
    path: "/home/{{ item.0 }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0 }}"
    group: "{{ item.0 }}"
    mode: "0700"
  loop: "{{ bootstrap_users | product(bootstrap_user_directories) | list }}"

- name: Ensure user SSH directories exist
  ansible.builtin.file:
    path: "/home/{{ item }}/.ssh"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ bootstrap_users }}"

- name: Reconcile authorized keys only when explicitly enabled
  ansible.builtin.copy:
    content: "{{ (bootstrap_authorized_keys[item] | join('\n')) + '\n' }}"
    dest: "/home/{{ item }}/.ssh/authorized_keys"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0600"
  loop: "{{ bootstrap_users }}"
  when:
    - bootstrap_manage_authorized_keys | bool
    - item in bootstrap_authorized_keys
  no_log: true

- name: Reconcile the managed shell environment block
  ansible.builtin.blockinfile:
    path: "/home/{{ item }}/.bashrc"
    create: true
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
    marker: "# {mark} BOOTSTRAP MANAGED SHELL SETTINGS"
    block: "{{ lookup('template', 'user-shell-block.j2') }}"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_user_dotfiles | bool

- name: Reconcile tmux configuration
  ansible.builtin.template:
    src: user-tmux.conf.j2
    dest: "/home/{{ item }}/.tmux.conf"
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0644"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_user_dotfiles | bool

- name: Gather bootstrap user IDs for rootless Docker runtime paths
  ansible.builtin.getent:
    database: passwd
  when: bootstrap_manage_rootless_docker | bool

- name: Configure non-overlapping subuid ranges for rootless Docker
  ansible.builtin.lineinfile:
    path: "{{ item.0 }}"
    regexp: "^{{ item.1 | regex_escape }}:"
    line: "{{ item.1 }}:{{ bootstrap_rootless_docker_subid_start + (bootstrap_users.index(item.1) | int) * bootstrap_rootless_docker_subid_size }}:{{ bootstrap_rootless_docker_subid_size }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['/etc/subuid', '/etc/subgid'] | product(bootstrap_users) | list }}"
  when: bootstrap_manage_rootless_docker | bool

- name: Enable lingering for rootless Docker users
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item }}"
    creates: "/var/lib/systemd/linger/{{ item }}"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_rootless_docker | bool

- name: Ensure rootless Docker runtime directories exist for bootstrap users
  ansible.builtin.file:
    path: "/run/user/{{ ansible_facts.getent_passwd[item][1] }}"
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: "0700"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_rootless_docker | bool

- name: Install rootless Docker user services when requested
  ansible.builtin.shell: |
    set -eu
    setup_tool="$(command -v dockerd-rootless-setuptool.sh || true)"
    if [ -z "$setup_tool" ] && [ -x /usr/share/docker.io/contrib/dockerd-rootless-setuptool.sh ]; then
      setup_tool=/usr/share/docker.io/contrib/dockerd-rootless-setuptool.sh
    fi
    test -n "$setup_tool"
    export XDG_RUNTIME_DIR="/run/user/$(id -u)"
    "$setup_tool" install
  args:
    executable: /bin/bash
    creates: "/home/{{ item }}/.config/systemd/user/docker.service"
  become_user: "{{ item }}"
  environment:
    HOME: "/home/{{ item }}"
    USER: "{{ item }}"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_rootless_docker | bool

- name: Enable rootless Docker service in each user manager
  ansible.builtin.file:
    path: "/home/{{ item }}/.config/systemd/user/default.target.wants/docker.service"
    src: ../docker.service
    state: link
    owner: "{{ item }}"
    group: "{{ item }}"
  loop: "{{ bootstrap_users }}"
  when: bootstrap_manage_rootless_docker | bool
